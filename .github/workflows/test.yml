name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and pytest
        run: pip install -e . pytest tomli

      - name: Run tests
        run: python -m pytest -q

      - name: Version consistency (pyproject, package, server.json)
        run: python -c "import sys, json, sentarion_mcp; tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli'); v=sentarion_mcp.__version__; assert v==tomllib.load(open('pyproject.toml','rb'))['project']['version'], 'pyproject drift'; assert v==json.load(open('server.json'))['version'], 'server.json drift'; assert all(p['version']==v for p in json.load(open('server.json'))['packages']), 'server.json packages drift'; print('version', v, 'consistent')"
