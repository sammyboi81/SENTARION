name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["server.json", ".github/workflows/mcp-publish.yml"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          chmod +x mcp-publisher

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          set +e
          OUT=$(./mcp-publisher publish 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "::error::mcp-publisher publish failed: ${OUT//$'\n'/ | }"
          fi
          exit $CODE
