[project]
name = "sentarion-mcp"
version = "0.1.0"
description = "Composite MCP server wrapping Algernon (fan-out orchestration) and ArkHive (governed audit/memory) with cost prediction, dependency-aware dispatch, and phase-gated approval."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "mcp-agent>=0.0.13",
]

[project.scripts]
sentarion = "sentarion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
