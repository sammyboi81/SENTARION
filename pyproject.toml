[project]
name = "sentarion-mcp"
version = "0.4.0"
readme = "README.md"
description = "Composite MCP server upgrading Algernon (fan-out orchestration), ArkHive (hosted governed audit/memory), and Humane Intelligence (local covenant/identity gate) into one substrate: two-chamber fail-closed governance, dual-chain tamper-evident memory, covenant-gated identity, cost prediction, and dependency-aware dispatch."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "arkhive-mcp>=0.2.1",
    "algernon-mcp>=0.1.1",
]

[project.urls]
Homepage = "https://inboxaxe.com/mcp"
Repository = "https://github.com/sammyboi81/sentarion"
"Issue Tracker" = "https://github.com/sammyboi81/sentarion/issues"
"Hosted endpoint" = "https://arkhive.dondatabrain.com/sentarion/mcp"

[project.scripts]
sentarion = "sentarion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
